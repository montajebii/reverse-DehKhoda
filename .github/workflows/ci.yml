name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- unit tests
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run test suite (hash embedder — no torch needed)
        run: python -m pytest tests -q --tb=short
        env:
          DEHKHODA_EMBEDDER: hash
          DEHKHODA_DENSE_DIM: "256"

  # ------------------------------------------------- PyInstaller sidecar build
  package-backend:
    name: pyinstaller (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sidecar (full profile, CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt pyinstaller
        working-directory: .
      - name: PyInstaller
        working-directory: backend
        env:
          DEHKHODA_BUNDLE_MODE: onedir
          DEHKHODA_BUNDLE_PROFILE: full
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build dehkhoda-server.spec
      - name: "Smoke: launch + health"
        working-directory: backend
        shell: bash
        run: |
          if [ -x dist/dehkhoda-server/dehkhoda-server ]; then BIN=dist/dehkhoda-server/dehkhoda-server; else BIN=dist/dehkhoda-server/dehkhoda-server.exe; fi
          DEHKHODA_EMBEDDER=hash DEHKHODA_DENSE_DIM=256 DEHKHODA_BACKEND=qdrant "$BIN" --port 8399 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8399/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8399/health | grep -q '"status":"ok"'
      - uses: actions/upload-artifact@v4
        with:
          name: dehkhoda-server-${{ matrix.os }}
          path: backend/dist/dehkhoda-server/
          retention-days: 7

  # ------------------------------------------------------------- desktop shell
  tauri:
    name: tauri (${{ matrix.os }})
    needs: [package-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          name: dehkhoda-server-${{ matrix.os }}
          path: backend/dist/dehkhoda-server
      - name: Make sidecar executable
        if: runner.os == 'Linux'
        run: chmod +x backend/dist/dehkhoda-server/dehkhoda-server
      - name: Tauri build
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          rm -rf src-tauri/resources/dehkhoda-server
          mkdir -p src-tauri/resources/dehkhoda-server
          cp -r ../backend/dist/dehkhoda-server/. src-tauri/resources/dehkhoda-server/
          npm install
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: dehkhoda-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
          retention-days: 7
