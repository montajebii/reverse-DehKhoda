name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: "Skip the 5 ingest-shard jobs; merge reuses shard-snapshot-* artifacts from a previous run"
        type: boolean
        default: false
      source_run_id:
        description: "Run ID owning the shard-snapshot-* artifacts (REQUIRED when skip_ingest=true)"
        type: string
        default: ""

permissions:
  contents: write

env:
  VERSION: "1.3.1"

jobs:
  # ================================================== Linux container tests
  container-tests:
    name: installer-adapters (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            setup: apt-get update && apt-get install -y python3
          - image: archlinux:base-devel
            setup: pacman -Sy --noconfirm --needed python
          - image: fedora:latest
            setup: dnf install -y python3
    steps:
      - uses: actions/checkout@v4
      - name: "Adapter test inside ${{ matrix.image }}"
        run: |
          docker run --rm -v "$PWD":/repo -w /repo ${{ matrix.image }} bash -c '
            set -e
            ${{ matrix.setup }} >/dev/null 2>&1 || ${{ matrix.setup }}
            echo "=== shape assertions ==="
            python3 bootstrap/tests/test_installer_linux.py
            echo "=== real engine install (package names must exist) ==="
            python3 bootstrap/tests/test_installer_linux.py --real
          '
      - name: "Milvus Lite wheel verification (Linux x86_64 + py3.12)"
        run: |
          docker run --rm -v "$PWD":/repo -w /repo python:3.12-slim bash -c '
            set -e
            # pymilvus alone is NOT enough: MilvusClient(uri="*.db") local mode
            # requires the separate milvus-lite embedded engine. If this install
            # fails, Milvus Lite is unavailable and the launch chain falls back
            # to Qdrant instead of silently assuming the wheel exists.
            pip install --quiet pymilvus milvus-lite
            python3 /repo/bootstrap/tests/test_milvus_lite.py
          '

  # ================================================== Windows bootstrap test
  windows-bootstrap:
    name: windows-bootstrap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "PowerShell syntax check (installer_win.ps1)"
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/bootstrap/installer_win.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "installer_win.ps1: syntax OK"
      - name: "Detector selftest (mocked Ubuntu/Arch/Win11)"
        run: python -m bootstrap.detector --selftest
      - name: "PS1 detect + no-docker scenario -> decision table"
        shell: pwsh
        run: |
          $out = & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File bootstrap/installer_win.ps1 -Action detect -AssumeNoDocker -JsonOut detect-absent.json
          Get-Content detect-absent.json
          $j = Get-Content detect-absent.json -Raw | ConvertFrom-Json
          if ($j.docker.installed -ne $false) { Write-Error "expected docker absent"; exit 1 }
          if ($j.ok -ne $true) { Write-Error "detect failed"; exit 1 }
          Write-Host "no-docker scenario OK"
      - name: "Decision table: Windows + docker declined -> qdrant_native; Linux default -> qdrant"
        run: python bootstrap/tests/test_decision_table.py
      - name: "state_env regression (v1.3.0 NameError: Path in resolve_model_dir)"
        run: python bootstrap/tests/test_state_env.py
      - name: "events ascii-safety (cp1252 UnicodeEncodeError on Windows pipes)"
        run: python bootstrap/tests/test_events_ascii.py
      - name: "v1.3.1 zero-network guard (socket monkeypatch + offline env)"
        run: python bootstrap/tests/test_net_guard.py
      - name: "v1.3.1 pin/constant sync (dataset commit pin, HF env mirror)"
        run: python bootstrap/tests/test_pins_sync.py
      - name: "v1.3.1 offline model load with zero connect() (skips w/o weights)"
        run: python bootstrap/tests/test_offline_guard.py

  # ================================================== Pinned model cache
  # ONE download of the pinned e5 revision per pins.json change; the tarball
  # is sha256-verified file-by-file BEFORE being cached/uploaded, so neither
  # the full build nor the lean acceptance seed ever trusts unverified bytes
  # and CI never depends on live HuggingFace beyond this job.
  model-cache:
    name: pinned model tarball (verify + cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: tar-cache
        with:
          path: model-e5.tar.gz
          key: model-e5-${{ hashFiles('bootstrap/pins.json') }}
      - name: Download + sha256-verify + pack (on cache miss)
        if: steps.tar-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch_pinned_model.py --dest model-e5 --tar model-e5.tar.gz
      - name: Verify tarball bytes against pins.json (ALWAYS, cache or not)
        run: |
          rm -rf /tmp/verify-model && mkdir -p /tmp/verify-model
          tar -xzf model-e5.tar.gz -C /tmp/verify-model
          REV=$(python3 -c "import json;print(json.load(open('bootstrap/pins.json'))['embedding_model']['revision'])")
          python3 scripts/fetch_pinned_model.py --from-dir "/tmp/verify-model/models/$REV"
          echo "revision: $REV"
          du -sh model-e5.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: model-tarball
          path: model-e5.tar.gz
          retention-days: 14

  # ================================================== BM25 stats pre-job
  # Option C: the 5 shard jobs must share ONE BM25 IDF statistics pickle —
  # a per-shard fit would silently poison cross-shard sparse ranking. The
  # pre-job fits on the deterministic first-30,000-row sample (EXACT corpus
  # parity with the monolithic DehkhodaLoader.ingest fit path) and must
  # match pins.bm25_stats.sha256 or this job dies in ~10 min — fail-fast
  # instead of poisoning ~4h of shard embedding. Also the dumps-gz artifact
  # source for the packaging jobs (the old snapshot job's role).
  bm25-stats:
    name: bm25 stats (corpus-wide fit, sha256-pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dumps + pack tarball
        run: |
          set -e
          python3 scripts/fetch_pinned_dumps.py --dest dh-dumps --tar dumps.tar.gz
      - name: Install Python deps (no torch — the fit needs analyzer + pymilvus only)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements-ci.txt
      - name: Build bm25_stats.pkl + verify against the committed pin
        run: |
          set -e
          SHA=$(python3 -c "import json;print(json.load(open('bootstrap/pins.json'))['bm25_stats']['sha256'])")
          test -n "$SHA" || { echo 'FATAL: pins.bm25_stats.sha256 empty'; exit 1; }
          DEHKHODA_DATA_DIR="$PWD/dh-bm25" python3 scripts/build_bm25_stats.py \
            --dumps dh-dumps --out bm25_stats.pkl --expect-sha "$SHA"
          # NOTE: fetch_pinned_dumps --dest is FLAT (dh-dumps/*.sql.gz);
          # the dumps/ top-level prefix exists only inside the tarball.
      - uses: actions/upload-artifact@v4
        with:
          name: bm25-stats
          path: bm25_stats.pkl
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dumps-gz
          path: dumps.tar.gz
          retention-days: 14

  # ================================================== Shard ingestion (Option C)
  # 312,506 usable rows split POSITIONALLY into 5 deterministic ranges
  # (bootstrap/ingest_shard.shard_range: base 62,501, remainder to shard 0 —
  # contiguous, no overlap, stable across runs). Each job ingests its range
  # with the EXACT production pipeline into its OWN runner-local qdrant and
  # snapshots it. fail-fast: false: if one shard dies early the other four
  # still finish so per-shard logs are comparable; the merge job depends on
  # ALL five succeeding via needs:. SAFEGUARD 3 asserts (partition, chunker
  # canary recount, pinned bm25) live inside bootstrap/ingest_shard.py.
  ingest-shard:
    name: ingest-shard (${{ matrix.shard }} of 5)
    runs-on: ubuntu-latest
    needs: [model-cache, bm25-stats]
    # push/tag runs: inputs.skip_ingest is null -> null != true -> jobs run.
    # dispatch with skip_ingest=true: the 4-5h shard work never re-executes.
    if: ${{ inputs.skip_ingest != true }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-tarball
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: dumps-gz
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: bm25-stats
          path: .
      - name: Compute shard cache key
        id: shardkey
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open("bootstrap/pins.json"))
          key = ("index-shard-v1.3.1-r3-${{ matrix.shard }}-"
                 + p["dehkhoda_dataset"]["commit"] + "-"
                 + p["embedding_model"]["revision"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("key=" + key + "\n")
          print("shard cache key:", key)
          PY
      - uses: actions/cache@v4
        id: shard-cache
        with:
          path: shard-out
          key: ${{ steps.shardkey.outputs.key }}
      - name: Cached shard -> verify + re-upload artifacts
        if: steps.shard-cache.outputs.cache-hit == 'true'
        run: |
          set -e
          test -f "shard-out/shard_report_${{ matrix.shard }}.json"
          test -f "shard-out/shard_${{ matrix.shard }}.snapshot.gz"
          python3 - <<'PY'
          import hashlib, json
          i = ${{ matrix.shard }}
          rep = json.load(open(f"shard_out/shard_report_{i}.json"))
          h = hashlib.sha256(open(f"shard_out/shard_{i}.snapshot.gz", "rb").read()).hexdigest()
          assert h == rep["snapshot_sha256"], "cached snapshot does not match its own report"
          pins = json.load(open("bootstrap/pins.json"))
          assert rep["bm25_sha256"] == pins["bm25_stats"]["sha256"], \
              "cached shard was built against a different bm25 pin"
          assert rep["chunks"] > 0 and rep["rows_count"] > 0, "cached shard report is empty"
          print("cached shard verified:", json.dumps(
              {k: rep[k] for k in ("shard", "start_row", "end_row", "rows_count",
                                   "chunks", "known_truncations")}))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.shard-cache.outputs.cache-hit == 'true'
        with:
          name: shard-snapshot-${{ matrix.shard }}
          path: |
            shard-out/shard_${{ matrix.shard }}.snapshot.gz
            shard-out/shard_report_${{ matrix.shard }}.json
          retention-days: 14
      - name: Install Python deps (real embedder path)
        if: steps.shard-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r backend/requirements.txt
      - name: Unpack dumps
        if: steps.shard-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          tar -xzf dumps.tar.gz
          N=$(find dumps -name '*.sql.gz' | wc -l)
          test "$N" = "33" || { echo "FATAL: expected 33 dumps, found $N"; exit 1; }
      - name: Fetch + start pinned qdrant engine (localhost)
        if: steps.shard-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p engine
          python3 - <<'PY'
          import shutil, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, ".")
          from bootstrap import model_fetcher
          pins = model_fetcher.load_pins()["qdrant"]
          f = pins["files"]["linux-x86_64"]
          dest = Path("engine") / f["name"]
          model_fetcher.download_file(f"{pins['base_url']}/{f['name']}", dest, sha256=f["sha256"])
          with tarfile.open(dest) as tf:
              tf.extractall("engine/x")
          src = next(p for p in Path("engine/x").rglob("qdrant") if p.is_file())
          shutil.move(str(src), "engine/qdrant")
          Path("engine/qdrant").chmod(0o755)
          print("qdrant engine ready:", pins["version"])
          PY
          mkdir -p engine-storage
          QDRANT__SERVICE__HTTP_PORT=6333 QDRANT__SERVICE__HOST=127.0.0.1 \
            QDRANT__STORAGE__STORAGE_PATH="$PWD/engine-storage" \
            QDRANT__TELEMETRY_DISABLED=true \
            nohup ./engine/qdrant > qdrant-shard.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:6333/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:6333/readyz
          echo "qdrant ready on 127.0.0.1:6333"
      - name: Seed model + state (production path)
        if: steps.shard-cache.outputs.cache-hit != 'true'
        env:
          DEHKHODA_DATA_DIR: "$PWD/dh-shard-data"
          DEHKHODA_PREFER_NATIVE: "1"
        run: |
          set -e
          mkdir -p "$DEHKHODA_DATA_DIR"
          tar -xzf model-e5.tar.gz -C "$DEHKHODA_DATA_DIR"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from bootstrap import model_download, paths, state
          rev = model_download.revision()
          tdir = paths.models_root() / rev
          assert (tdir / "model.safetensors").exists(), "seed model missing"
          model_download.ensure_model_ready("seeded")
          st = state.load()
          st["model"] = {"source": "seeded", "dir": str(tdir),
                         "revision": rev, "verified": True}
          state.save(st)
          state.set_value("embedder", "e5-base")
          state.set_value("backend", "qdrant_native")
          print("state seeded:", rev)
          PY
      - name: Ingest shard range (SAFEGUARD 3 asserts + heartbeat inside)
        if: steps.shard-cache.outputs.cache-hit != 'true'
        env:
          DEHKHODA_DATA_DIR: "$PWD/dh-shard-data"
          DEHKHODA_BACKEND: "qdrant"
          DEHKHODA_QDRANT_MODE: "server"
          DEHKHODA_QDRANT_URL: "http://127.0.0.1:6333"
          DEHKHODA_COLLECTION_NAME: "dehkhoda"
          DEHKHODA_EMBED_BATCH_SIZE: "128"
          OMP_NUM_THREADS: "4"
          PYTHONHASHSEED: "0"
        run: |
          set -e
          mkdir -p shard-out
          python3 bootstrap/ingest_shard.py \
            --shard ${{ matrix.shard }} --shards 5 \
            --dumps dumps \
            --bm25-stats bm25_stats.pkl \
            --out shard-out
      - uses: actions/upload-artifact@v4
        if: steps.shard-cache.outputs.cache-hit != 'true'
        with:
          name: shard-snapshot-${{ matrix.shard }}
          path: |
            shard-out/shard_${{ matrix.shard }}.snapshot.gz
            shard-out/shard_report_${{ matrix.shard }}.json
          retention-days: 14

  # ================================================== Merge (Option C)
  # Restores the 5 shard snapshots into temp collections, scrolls + upserts
  # every point into the production main collection (5,000-point batches,
  # progress line per batch, 60-min soft / 90-min hard timeout — SAFEGUARD 4),
  # asserts the two sums (351,156 chunks / 384 truncations +-0 — SAFEGUARD 3),
  # runs the 3 fixed Persian semantic probes (SAFEGUARD 2: dense exact cosine
  # > 0.5 + hybrid >= 1 hit + non-empty payload; sparse-only 0 hits = WARN),
  # and ONLY THEN takes the final snapshot and prints the PIN-FILL values.
  # NEVER merges via recover_snapshot chaining (empirically falsified).
  merge-index:
    name: merge shards -> final snapshot (probes + pin)
    runs-on: ubuntu-latest
    needs: [bm25-stats, ingest-shard]
    # skip_ingest dispatch: the shard jobs are SKIPPED on purpose; the merge
    # still runs and reuses the 5 shard-snapshot-* artifacts from
    # source_run_id (merge_index.py re-verifies every artifact sha256
    # against its shard report, so reuse is integrity-gated).
    if: ${{ !cancelled() && needs.bm25-stats.result == 'success' && (needs.ingest-shard.result == 'success' || inputs.skip_ingest == true) }}
    # job-level permissions REPLACE the workflow-level set: GITHUB_TOKEN
    # needs actions:write (upload artifact) which includes read (download
    # shard-snapshot-* from ANOTHER run), contents:read (checkout).
    permissions:
      actions: write
      contents: read
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Guard - skip_ingest requires source_run_id
        if: ${{ inputs.skip_ingest == true && inputs.source_run_id == '' }}
        run: |
          echo "FATAL: skip_ingest=true requires the workflow_dispatch input"
          echo "source_run_id (the run that owns the shard-snapshot-* artifacts)."
          exit 1
      - uses: actions/download-artifact@v4
        if: ${{ inputs.skip_ingest != true }}
        with:
          pattern: shard-snapshot-*
          path: shard-artifacts
          merge-multiple: true
      - name: Reuse shard artifacts from run ${{ inputs.source_run_id }} (skip_ingest=true)
        if: ${{ inputs.skip_ingest == true }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-snapshot-*
          path: shard-artifacts
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: bm25-stats
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: model-tarball
          path: .
      - name: Compute merge cache key
        id: mergekey
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open("bootstrap/pins.json"))
          key = ("index-snapshot-v1.3.1-r3-"
                 + p["dehkhoda_dataset"]["commit"] + "-"
                 + p["embedding_model"]["revision"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("key=" + key + "\n")
          print("merge cache key:", key)
          PY
      - uses: actions/cache@v4
        id: merge-cache
        with:
          path: |
            merge-out/dehkhoda.snapshot.gz
            merge-out/prebuilt_index_meta.json
            merge-out/merge_report.json
          key: ${{ steps.mergekey.outputs.key }}
      - name: Cached merge -> verify + re-upload artifacts
        if: steps.merge-cache.outputs.cache-hit == 'true'
        run: |
          set -e
          test -f merge-out/dehkhoda.snapshot.gz
          test -f merge-out/prebuilt_index_meta.json
          cp bm25_stats.pkl merge-out/bm25_stats.pkl
          python3 - <<'PY'
          import hashlib, json
          pins_root = json.load(open("bootstrap/pins.json"))
          h = hashlib.sha256(open("merge-out/dehkhoda.snapshot.gz", "rb").read()).hexdigest()
          meta = json.load(open("merge-out/prebuilt_index_meta.json"))
          assert h == meta["snapshot_sha256"], "cached snapshot does not match its own meta"
          pin = pins_root["prebuilt_index"].get("snapshot_sha256")
          if pin:
              assert h == pin, f"cached snapshot {h} != committed pin {pin}"
          bm = hashlib.sha256(open("merge-out/bm25_stats.pkl", "rb").read()).hexdigest()
          assert bm == pins_root["bm25_stats"]["sha256"], "bm25 pkl does not match the pin"
          print("cached merge verified: record_count", meta["record_count"], h[:12])
          PY
      - uses: actions/upload-artifact@v4
        if: steps.merge-cache.outputs.cache-hit == 'true'
        with:
          name: index-snapshot
          path: |
            merge-out/dehkhoda.snapshot.gz
            merge-out/prebuilt_index_meta.json
            merge-out/bm25_stats.pkl
            merge-out/merge_report.json
          retention-days: 14
      - name: Install Python deps (probe embedder needs torch)
        if: steps.merge-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r backend/requirements.txt
      - name: Fetch + start pinned qdrant engine (localhost)
        if: steps.merge-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p engine
          python3 - <<'PY'
          import shutil, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, ".")
          from bootstrap import model_fetcher
          pins = model_fetcher.load_pins()["qdrant"]
          f = pins["files"]["linux-x86_64"]
          dest = Path("engine") / f["name"]
          model_fetcher.download_file(f"{pins['base_url']}/{f['name']}", dest, sha256=f["sha256"])
          with tarfile.open(dest) as tf:
              tf.extractall("engine/x")
          src = next(p for p in Path("engine/x").rglob("qdrant") if p.is_file())
          shutil.move(str(src), "engine/qdrant")
          Path("engine/qdrant").chmod(0o755)
          print("qdrant engine ready:", pins["version"])
          PY
          mkdir -p "${{ github.workspace }}/dh-merge/qdrant-server"
          QDRANT__SERVICE__HTTP_PORT=6333 QDRANT__SERVICE__HOST=127.0.0.1 \
            QDRANT__STORAGE__STORAGE_PATH="${{ github.workspace }}/dh-merge/qdrant-server" \
            QDRANT__TELEMETRY_DISABLED=true \
            nohup ./engine/qdrant > qdrant-merge.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:6333/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:6333/readyz
          echo "qdrant ready on 127.0.0.1:6333"
      - name: Seed model (probes embed queries)
        if: steps.merge-cache.outputs.cache-hit != 'true'
        env:
          # RUN-#35 ROOT CAUSE: GitHub env: values are NOT shell-expanded —
          # "$PWD/dh-merge" stayed the literal string and tar -C hit the
          # never-created literal dir -> GNU tar fatal -> exit 2 at 1m52s.
          # ${{ github.workspace }} IS expanded by the runner before bash.
          DEHKHODA_DATA_DIR: "${{ github.workspace }}/dh-merge"
        run: |
          set -e
          mkdir -p "$DEHKHODA_DATA_DIR"
          tar -xzf model-e5.tar.gz -C "$DEHKHODA_DATA_DIR"
          # SAFEGUARD 2 probes load data_dir/bm25_stats.pkl (commit-5 runtime
          # contract) — stage the pinned stats next to the seeded model.
          cp bm25_stats.pkl "$DEHKHODA_DATA_DIR/bm25_stats.pkl"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from bootstrap import model_download, paths, state
          rev = model_download.revision()
          tdir = paths.models_root() / rev
          assert (tdir / "model.safetensors").exists(), "seed model missing"
          model_download.ensure_model_ready("seeded")
          st = state.load()
          st["model"] = {"source": "seeded", "dir": str(tdir),
                         "revision": rev, "verified": True}
          state.save(st)
          state.set_value("embedder", "e5-base")
          state.set_value("backend", "qdrant_native")
          print("state seeded:", rev)
          PY
      - name: Merge shards -> SAFEGUARD asserts -> probes -> final snapshot
        if: steps.merge-cache.outputs.cache-hit != 'true'
        env:
          DEHKHODA_DATA_DIR: "${{ github.workspace }}/dh-merge"
          # must equal the server's STORAGE_PATH below, or recover_snapshot
          # dies with file://-outside-server-storage (latent run-#35 bug #2)
          DEHKHODA_QDRANT_STORAGE: "${{ github.workspace }}/dh-merge/qdrant-server"
          DEHKHODA_BACKEND: "qdrant"
          DEHKHODA_QDRANT_MODE: "server"
          DEHKHODA_QDRANT_URL: "http://127.0.0.1:6333"
          DEHKHODA_COLLECTION_NAME: "dehkhoda"
          DEHKHODA_EMBED_BATCH_SIZE: "128"
          PYTHONHASHSEED: "0"
        run: |
          set -e
          mkdir -p merge-out
          python3 bootstrap/merge_index.py \
            --shards-artifacts shard-artifacts \
            --bm25-stats bm25_stats.pkl \
            --out merge-out
      - name: Assert index-snapshot artifact contains bm25_stats.pkl
        if: steps.merge-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          cp bm25_stats.pkl merge-out/bm25_stats.pkl
          test -f merge-out/bm25_stats.pkl
          python3 - <<'PY'
          import hashlib, json
          pins = json.load(open("bootstrap/pins.json"))
          h = hashlib.sha256(open("merge-out/bm25_stats.pkl", "rb").read()).hexdigest()
          assert h == pins["bm25_stats"]["sha256"], "bm25 pkl in the artifact != pin"
          meta = json.load(open("merge-out/prebuilt_index_meta.json"))
          assert meta["bm25_stats_sha256"] == h, "meta bm25 sha != artifact pkl"
          print("index-snapshot artifact contains bm25_stats.pkl (sha256 pinned OK)")
          PY
      - uses: actions/upload-artifact@v4
        if: steps.merge-cache.outputs.cache-hit != 'true'
        with:
          name: index-snapshot
          path: |
            merge-out/dehkhoda.snapshot.gz
            merge-out/prebuilt_index_meta.json
            merge-out/bm25_stats.pkl
            merge-out/merge_report.json
          retention-days: 14

  # ================================================== Linux packages
  # Built INSIDE a debian:12 container so the bundled binaries link against
  # glibc 2.36 — the oldest of our supported targets (Debian 12, Ubuntu
  # 22.04+, Arch, Fedora). Binaries built on newer glibc would refuse to run
  # on Debian 12 ("GLIBC_2.38 not found") — one of the root causes of the
  # v1.2.0 "engine is not available" reports.
  #
  # v1.3.0: TWO release variants from the same codebase —
  #   full: model tarball staged into _internal/models (offline-complete)
  #   lean: no model inside (wizard downloads on first run)
  build-linux:
    name: packages (linux, debian-12 container)
    runs-on: ubuntu-latest
    needs: [model-cache, merge-index]
    container:
      image: python:3.12-slim-bookworm
    steps:
      - name: System deps (git, node, rust, Tauri, AppImage tooling)
        run: |
          set -e
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git curl xz-utils ca-certificates build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file libfuse2 zstd
          # Node 20 (binary tarball; nodesource not needed)
          curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz \
            | tar -xJ -C /usr/local --strip-components=1
          # Rust: GH container jobs set HOME=/github/home while the passwd
          # db says /root — rustup-init refuses that mismatch. Pin all three
          # homes to /root and export them for later steps.
          export HOME=/root
          echo "HOME=/root" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/root/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/root/.rustup" >> "$GITHUB_ENV"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-tarball
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: index-snapshot
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: dumps-gz
          path: .
      - name: Install Python deps (PyInstaller + backend)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt pyinstaller
      - name: Backend + full/lean AppImages + deb (+ bundled qdrant sidecar)
        run: bash installer/linux/appimage.sh
        env:
          DEHKHODA_BUNDLE_PROFILE: full
          DEHKHODA_VARIANTS: "full lean"
          # ${{ github.workspace }} (runner-expanded) — literal $PWD env
          # values never resolve (latent run-#35 bug #3, packaging class)
          DEHKHODA_MODEL_TARBALL: "${{ github.workspace }}/model-e5.tar.gz"
          # v1.3.1: dataset + prebuilt index bundle (full variant only)
          DEHKHODA_DATASET_TARBALL: "${{ github.workspace }}/dumps.tar.gz"
          DEHKHODA_INDEX_SNAPSHOT: "${{ github.workspace }}/dehkhoda.snapshot.gz"
          # v1.3.1 Option C: corpus-wide BM25 stats ride in the same artifact
          DEHKHODA_BM25_STATS: "${{ github.workspace }}/bm25_stats.pkl"
          # no /dev/fuse anywhere on CI — extract-and-run sidesteps FUSE for
          # the AppImage-based bundler tools (linuxdeploy, appimagetool)
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Normalize .deb filename (space -> dot, GitHub asset rule)
        shell: bash   # ${var// /./} is bash-only; job default shell is sh/dash
        run: |
          # tauri deb = "${productName}_${version}_${arch}.deb" and the
          # productName is "Dehkhoda RAG" — with a SPACE. GitHub release
          # assets may not contain spaces: on upload the asset becomes
          # "Dehkhoda.RAG_...deb" while SHA256SUMS.all (hashed from the
          # on-disk name) keeps the space -> sha256sum -c on the release
          # page fails (v1.3.0 release-page defect). Rename BEFORE any
          # hashing so disk name == asset name everywhere. arch.sh parses
          # the version with cut -d_ -f2, which is unaffected.
          cd dist-linux
          for f in Dehkhoda\ RAG_*.deb; do
            [ -e "$f" ] || continue
            mv -v "$f" "${f// /.}"
          done
          ls -la *.deb
      - name: "Build gate: engine smoke — default chain (qdrant local)"
        run: |
          BIN=backend/dist/dehkhoda-server/dehkhoda-server
          export DEHKHODA_DATA_DIR=/tmp/dh-ci
          "$BIN" bootstrap --step engine-smoke 2>&1 | tail -1 | tee /tmp/smoke-chain.json
          grep -q '"ok": *true' /tmp/smoke-chain.json
          grep -q 'hybrid_hits' /tmp/smoke-chain.json
      - name: "Build gate: engine smoke — bundled qdrant SIDECAR (gz self-extract)"
        run: |
          BIN=backend/dist/dehkhoda-server/dehkhoda-server
          export DEHKHODA_DATA_DIR=/tmp/dh-ci
          export DEHKHODA_QDRANT_GZ="$PWD/desktop/src-tauri/resources/sidecars/qdrant/qdrant.gz"
          unset DEHKHODA_QDRANT_BINARY || true
          "$BIN" bootstrap --step engine-smoke --engine qdrant_native 2>&1 | tail -1 | tee /tmp/smoke-sidecar.json
          grep -q '"ok": *true' /tmp/smoke-sidecar.json
      - name: "Build gate: milvus_lite packaged-binary smoke (Ubuntu engine rule)"
        run: |
          BIN=backend/dist/dehkhoda-server/dehkhoda-server
          export DEHKHODA_DATA_DIR=/tmp/dh-ci
          "$BIN" bootstrap --step engine-smoke --engine milvus_lite 2>&1 | tail -1 | tee /tmp/smoke-lite.json
          grep -q '"ok": *true' /tmp/smoke-lite.json
      - name: CLI selftest on the bundled sidecar
        run: |
          BIN=backend/dist/dehkhoda-server/dehkhoda-server
          DEHKHODA_DATA_DIR=/tmp/dh-ci "$BIN" bootstrap --step selftest | tail -1 | grep -q '"ok": *true'
          DEHKHODA_DATA_DIR=/tmp/dh-ci "$BIN" bootstrap --step report | tail -1 | grep -q '"ok": *true'
      - uses: actions/upload-artifact@v4
        with:
          name: dehkhoda-linux-full
          path: |
            dist-linux/*-full.AppImage
            dist-linux/*.deb
            dist-linux/SHA256SUMS
            dist-linux/qdrant-sha256.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dehkhoda-linux-lean
          path: dist-linux/*-lean.AppImage
          retention-days: 14

  # ================================================== Linux acceptance tests
  # Runs the PACKAGED AppImage inside clean distro containers for BOTH
  # variants (4 distros x full/lean = 8 jobs). Each container is started with
  # `--network none` AFTER its image was pulled — every assertion therefore
  # holds with ZERO network access:
  #   full: v1.3.1 Test A — tcpdump observes EXACTLY 0 non-loopback packets
  #         (and 0 DNS packets), the bundled snapshot restores in <90s, the
  #         record count matches the pin, one real Persian hybrid search
  #         returns a plausible headword, /health reports source=bundled,
  #         and the extracted UI bundle contains no external URLs.
  #         PLUS Test C — --rebuild-index offline from the bundled SQL.
  #   lean: model pre-seeded into the data dir from the CI tarball, then the
  #         v1.3.0 engine + model assertions (Test B infrastructure).
  # tcpdump is NOT preinstalled in the distro images and the acceptance run
  # has no network — so for FULL jobs we derive a committed image with
  # tcpdump installed while the network is still up (docker commit), then
  # run the acceptance itself with --network none from that image.
  linux-acceptance:
    name: appimage-acceptance (${{ matrix.variant }}, ${{ matrix.image }})
    needs: [build-linux, model-cache]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:12, fedora:latest, archlinux:base-devel]
        variant: [full, lean]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dehkhoda-linux-${{ matrix.variant }}
          path: dist-linux
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'lean'
        with:
          name: model-tarball
          path: .
      - name: Arch package (.pkg.tar.zst) — full variant only
        if: matrix.image == 'archlinux:base-devel' && matrix.variant == 'full'
        run: |
          docker run --rm -v "$PWD":/repo -w /repo archlinux:base-devel bash -c '
            set -e
            pacman -Sy --noconfirm --needed zstd >/dev/null
            # QUOTE the $(ls ...) — the deb filename has a space (productName
            # is "Dehkhoda RAG"), so unquoted word-splits into two args and
            # ar fails with "No such file: dist-linux/Dehkhoda".
            bash installer/linux/arch.sh "$(ls -t dist-linux/*.deb | head -1)"
          '
      - name: Pull image (network ON — the acceptance run itself is offline)
        run: docker pull ${{ matrix.image }}
      - name: Prepare tcpdump-capable image (full variant only, network ON)
        if: matrix.variant == 'full'
        run: |
          set -e
          case '${{ matrix.image }}' in
            ubuntu:*|debian:*)  PKG="apt-get update -qq && apt-get install -y -qq tcpdump" ;;
            fedora:*)           PKG="dnf install -y -q tcpdump" ;;
            archlinux:*)        PKG="pacman -Sy --noconfirm --needed tcpdump" ;;
            *) echo "unknown distro"; exit 1 ;;
          esac
          docker run --name dh-tcpdump-prep ${{ matrix.image }} bash -c "$PKG >/dev/null 2>&1 && tcpdump --version | head -1"
          docker commit dh-tcpdump-prep dh-acc:${{ matrix.variant }}-$(echo '${{ matrix.image }}' | tr ':.' '--')
          docker rm dh-tcpdump-prep
      - name: "Test A — full offline acceptance (network NONE, tcpdump == 0 packets): ${{ matrix.image }}"
        if: matrix.variant == 'full'
        run: |
          IMG=dh-acc:$(echo '${{ matrix.image }}' | tr ':.' '--')
          docker run --rm --network none -v "$PWD":/repo \
            $IMG \
            bash /repo/bootstrap/tests/full_offline_acceptance.sh /repo
      - name: "Test C — rebuild index offline from bundled SQL (network NONE): ${{ matrix.image }}"
        if: matrix.variant == 'full'
        run: |
          IMG=dh-acc:$(echo '${{ matrix.image }}' | tr ':.' '--')
          docker run --rm --network none -v "$PWD":/repo \
            -e DEHKHODA_EMBEDDER=hash -e DEHKHODA_DENSE_DIM=256 \
            $IMG \
            bash /repo/bootstrap/tests/full_offline_acceptance.sh /repo --test-c
      - name: "Acceptance (network NONE): lean on ${{ matrix.image }}"
        if: matrix.variant == 'lean'
        run: |
          # seed args: the tarball mounts read-only at /model-e5.tar.gz and
          # appimage_acceptance.sh extracts it into DEHKHODA_DATA_DIR.
          docker run --rm --network none \
            -v "$PWD":/repo -v "$PWD/model-e5.tar.gz":/model-e5.tar.gz:ro \
            -e DEHKHODA_MODEL_TARBALL=/model-e5.tar.gz \
            ${{ matrix.image }} \
            bash /repo/bootstrap/tests/appimage_acceptance.sh /repo
      - name: SHA256 checksums (incl. arch package)
        if: matrix.image == 'archlinux:base-devel' && matrix.variant == 'full'
        run: |
          cd dist-linux
          sha256sum ./*.AppImage ./*.deb ./*.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS
      # Separate artifact: upload-artifact v4 overwrite=true REPLACES the
      # whole artifact (it would destroy the AppImage + deb from build-linux).
      - uses: actions/upload-artifact@v4
        if: matrix.image == 'archlinux:base-devel' && matrix.variant == 'full'
        with:
          name: dehkhoda-linux-arch
          path: |
            dist-linux/*.pkg.tar.zst
            dist-linux/SHA256SUMS
          retention-days: 14

  # ================================================== Windows installer
  # v1.3.0: ONE PyInstaller build, TWO NSIS passes —
  #   lean: resources staged WITHOUT the model  -> -DSUFFIX=-lean
  #   full: model tarball extracted into _internal\models -> -DSUFFIX=-full
  build-windows:
    name: installer (windows, full + lean)
    runs-on: windows-latest
    needs: [model-cache, merge-index]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: model-tarball
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: index-snapshot
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: dumps-gz
          path: .
      - name: Build sidecar (full profile)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt pyinstaller
          cd backend
          DEHKHODA_BUNDLE_MODE=onedir DEHKHODA_BUNDLE_PROFILE=full \
            python -m PyInstaller --noconfirm --clean --distpath dist --workpath build dehkhoda-server.spec
      - name: Fetch pinned qdrant.exe sidecar
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources/sidecars/qdrant
          python - <<PY
          import shutil, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, ".")
          from bootstrap import model_fetcher
          pins = model_fetcher.load_pins()["qdrant"]
          f = pins["files"]["windows-x86_64"]
          dest = Path("desktop/src-tauri/resources/sidecars/qdrant") / f["name"]
          model_fetcher.download_file(f"{pins['base_url']}/{f['name']}", dest, sha256=f["sha256"])
          out = Path("desktop/src-tauri/resources/sidecars/qdrant/qdrant.exe")
          with zipfile.ZipFile(dest) as zf:
              src = next(n for n in zf.namelist() if n.endswith("qdrant.exe"))
              with zf.open(src) as s, open(out, "wb") as d:
                  shutil.copyfileobj(s, d)
          dest.unlink()
          print("qdrant.exe ready:", out.stat().st_size, "bytes")
          PY
      - name: Stage resources + Tauri build (lean content — no model yet)
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/resources/dehkhoda-server
          rm -rf desktop/src-tauri/resources/dehkhoda-server/*
          cp -r backend/dist/dehkhoda-server/. desktop/src-tauri/resources/dehkhoda-server/
          # v1.3.1: explicit LEAN manifest — the zero-network guard and the
          # index-restore branches read _internal/bundle.json
          mkdir -p desktop/src-tauri/resources/dehkhoda-server/_internal
          printf '{"variant":"lean","model":false,"dataset":false,"index":false}\n' \
            > desktop/src-tauri/resources/dehkhoda-server/_internal/bundle.json
          cat desktop/src-tauri/resources/dehkhoda-server/_internal/bundle.json
          # v1.2.1 built the GUI here; the v1.3.0 split dropped it and NSIS
          # prelude died on Resolve-Path (no dehkhoda-rag.exe). Build once —
          # the exe is variant-agnostic (NSIS packages resources from disk).
          cd desktop && npm install --no-fund --no-audit && npx tauri build --no-bundle
      - name: "Build gate: engine smoke (qdrant default) on the packaged sidecar"
        shell: bash
        run: |
          BIN=backend/dist/dehkhoda-server/dehkhoda-server.exe
          export DEHKHODA_DATA_DIR="$PWD/.dh-ci"
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8   # Windows pipes default to cp1252
          # stderr is captured (not discarded) so a gate failure shows the
          # real traceback in the job log — the v1.3.0 NameError was invisible
          # behind 2>/dev/null and cost a full re-run to diagnose
          "$BIN" bootstrap --step engine-smoke >gate.json 2>gate.err \
            || { echo 'engine-smoke gate FAILED:'; cat gate.err; exit 1; }
          tail -1 gate.json | grep -q '"ok": *true' \
            || { echo 'engine-smoke gate not ok:'; cat gate.json gate.err; exit 1; }
      - name: Compile NSIS installer (LEAN)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Resolve-Path normalises to native backslashes. NSIS `File` chokes
          # on the mixed forward/backward slashes that "$PWD/$relpath"
          # produces on Windows runners ("no files found" at compile time).
          $exe = (Resolve-Path "desktop/src-tauri/target/release/dehkhoda-rag.exe").Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            -DAPP_EXE="$exe" `
            -DBACKEND_DIR="$PWD/desktop/src-tauri/resources/dehkhoda-server" `
            -DQDRANT_DIR="$PWD/desktop/src-tauri/resources/sidecars/qdrant" `
            -DVERSION="${{ env.VERSION }}" -DSUFFIX="-lean" `
            installer/windows/nsis.nsi
      - name: Stage FULL content into _internal (model + dataset + snapshot)
        shell: bash
        run: |
          set -e
          REV=$(python -c "import json;print(json.load(open('bootstrap/pins.json'))['embedding_model']['revision'])")
          SHA_PIN=$(python -c "import json;print(json.load(open('bootstrap/pins.json'))['prebuilt_index']['snapshot_sha256'])")
          test -n "$SHA_PIN" || { echo 'FATAL: pins.prebuilt_index.snapshot_sha256 empty — CI snapshot job must run first'; exit 1; }
          mkdir -p desktop/src-tauri/resources/dehkhoda-server/_internal
          tar -xzf model-e5.tar.gz -C desktop/src-tauri/resources/dehkhoda-server/_internal
          test -f "desktop/src-tauri/resources/dehkhoda-server/_internal/models/$REV/model.safetensors"
          echo "staged bundled model (revision $REV)"
          # v1.3.1: dataset (33 pinned dumps) + prebuilt snapshot + manifest
          tar -xzf dumps.tar.gz -C desktop/src-tauri/resources/dehkhoda-server/_internal
          N=$(find desktop/src-tauri/resources/dehkhoda-server/_internal/dumps -name '*.sql.gz' | wc -l)
          test "$N" = "33" || { echo "FATAL: expected 33 dumps, found $N"; exit 1; }
          mkdir -p desktop/src-tauri/resources/dehkhoda-server/_internal/index
          cp dehkhoda.snapshot.gz desktop/src-tauri/resources/dehkhoda-server/_internal/index/dehkhoda.snapshot.gz
          ACTUAL=$(sha256sum desktop/src-tauri/resources/dehkhoda-server/_internal/index/dehkhoda.snapshot.gz | awk '{print $1}')
          test "$ACTUAL" = "$SHA_PIN" || { echo "FATAL: snapshot sha mismatch: $ACTUAL != $SHA_PIN"; exit 1; }
          # v1.3.1 Option C: corpus-wide BM25 stats beside the snapshot
          cp bm25_stats.pkl desktop/src-tauri/resources/dehkhoda-server/_internal/index/bm25_stats.pkl
          ACTUAL_BM25=$(sha256sum desktop/src-tauri/resources/dehkhoda-server/_internal/index/bm25_stats.pkl | awk '{print $1}')
          BM25_PIN=$(python -c "import json;print(json.load(open('bootstrap/pins.json'))['bm25_stats']['sha256'])")
          test "$ACTUAL_BM25" = "$BM25_PIN" || { echo "FATAL: bm25 stats sha mismatch: $ACTUAL_BM25 != $BM25_PIN"; exit 1; }
          printf '{"variant":"full","model":true,"dataset":true,"index":true}\n' \
            > desktop/src-tauri/resources/dehkhoda-server/_internal/bundle.json
          cat desktop/src-tauri/resources/dehkhoda-server/_internal/bundle.json
          echo "staged dataset (33 dumps) + snapshot ($ACTUAL) + full manifest"
          # also stage into backend/dist so the build gates below exercise the
          # exact bytes that ship inside the full installer
          mkdir -p backend/dist/dehkhoda-server/_internal
          tar -xzf model-e5.tar.gz -C backend/dist/dehkhoda-server/_internal
          tar -xzf dumps.tar.gz -C backend/dist/dehkhoda-server/_internal
          mkdir -p backend/dist/dehkhoda-server/_internal/index
          cp dehkhoda.snapshot.gz backend/dist/dehkhoda-server/_internal/index/dehkhoda.snapshot.gz
          printf '{"variant":"full","model":true,"dataset":true,"index":true}\n' \
            > backend/dist/dehkhoda-server/_internal/bundle.json
      - name: "Build gate: bundled model verify + real e5 dense probe (full bytes)"
        shell: bash
        run: |
          BIN=backend/dist/dehkhoda-server/dehkhoda-server.exe
          export DEHKHODA_DATA_DIR="$PWD/.dh-ci"
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8   # Windows pipes default to cp1252
          "$BIN" bootstrap --step model --check >gate-model.json 2>gate-model.err \
            || { echo 'model --check gate FAILED:'; cat gate-model.err; exit 1; }
          tail -1 gate-model.json | grep -q '"ok": *true' \
            || { echo 'model --check gate not ok:'; cat gate-model.json gate-model.err; exit 1; }
          "$BIN" bootstrap --step engine-smoke --engine dense >gate-dense.json 2>gate-dense.err \
            || { echo 'engine-smoke dense gate FAILED:'; cat gate-dense.err; exit 1; }
          tail -1 gate-dense.json | grep -q '"ok": *true' \
            || { echo 'engine-smoke dense gate not ok:'; cat gate-dense.json gate-dense.err; exit 1; }
      - name: "Build gate: offline guard unit tests (zero-network closure)"
        shell: bash
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python bootstrap/tests/test_net_guard.py
          python bootstrap/tests/test_pins_sync.py
          python bootstrap/tests/test_offline_guard.py
      - name: "Build gate: SNAPSHOT RESTORE on Windows (cross-platform portability)"
        shell: bash
        run: |
          BIN=backend/dist/dehkhoda-server/dehkhoda-server.exe
          export DEHKHODA_DATA_DIR="$PWD/.dh-restore"
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          export DEHKHODA_QDRANT_BINARY="$PWD/desktop/src-tauri/resources/sidecars/qdrant/qdrant.exe"
          "$BIN" bootstrap --step index --bundle-index >gate-restore.json 2>gate-restore.err \
            || { echo 'index --bundle-index gate FAILED:'; cat gate-restore.err; exit 1; }
          tail -1 gate-restore.json | grep -q '"ok": *true' \
            || { echo 'restore gate not ok:'; cat gate-restore.json gate-restore.err; exit 1; }
          tail -1 gate-restore.json
          tail -1 gate-restore.json | grep -q '"mode": *"restored"' \
            || { echo 'restore gate: dataset event mode != restored'; exit 1; }
          "$BIN" bootstrap --step index --verify-index >gate-verify.json 2>gate-verify.err \
            || { echo 'verify-index gate FAILED:'; cat gate-verify.err; exit 1; }
          tail -1 gate-verify.json | grep -q '"ok": *true' \
            || { echo 'verify-index gate not ok:'; cat gate-verify.json gate-verify.err; exit 1; }
      - name: Compile NSIS installer (FULL)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "desktop/src-tauri/target/release/dehkhoda-rag.exe").Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            -DAPP_EXE="$exe" `
            -DBACKEND_DIR="$PWD/desktop/src-tauri/resources/dehkhoda-server" `
            -DQDRANT_DIR="$PWD/desktop/src-tauri/resources/sidecars/qdrant" `
            -DVERSION="${{ env.VERSION }}" -DSUFFIX="-full" `
            installer/windows/nsis.nsi
      - name: Sign installers (if certificate secret present)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$PWD\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Select-Object -First 1 -ExpandProperty FullName
          foreach ($v in @("lean", "full")) {
            & $signtool sign /f $pfx /p "$env:WINDOWS_CERTIFICATE_PASSWORD" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              "installer/windows/dehkhoda-setup-win-${{ env.VERSION }}-$v.exe"
          }
          Remove-Item $pfx
      - name: SHA256 + collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win | Out-Null
          # NSIS writes OutFile next to the .nsi script (installer/windows/).
          $failed = $false
          foreach ($v in @("lean", "full")) {
            $src = "installer/windows/dehkhoda-setup-win-${{ env.VERSION }}-$v.exe"
            if (-not (Test-Path $src)) { Write-Error "installer not found at $src"; $failed = $true; continue }
            Copy-Item $src dist-win/
            $h = (Get-FileHash "dist-win\dehkhoda-setup-win-${{ env.VERSION }}-$v.exe" -Algorithm SHA256).Hash.ToLower()
            "$h  dehkhoda-setup-win-${{ env.VERSION }}-$v.exe" | Add-Content dist-win\SHA256SUMS.txt
          }
          if ($failed) { exit 1 }
          Get-Content dist-win\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dehkhoda-windows
          path: |
            dist-win/dehkhoda-setup-win-${{ env.VERSION }}-full.exe
            dist-win/dehkhoda-setup-win-${{ env.VERSION }}-lean.exe
            dist-win/SHA256SUMS.txt
          retention-days: 14

  # ================================================== GitHub Release
  release:
    name: github-release (4 variants + SHA256SUMS.all)
    needs: [container-tests, windows-bootstrap, model-cache, merge-index,
            build-linux, linux-acceptance, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dehkhoda-linux-full
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: dehkhoda-linux-lean
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: dehkhoda-linux-arch
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: dehkhoda-windows
          path: rel
      - name: Build SHA256SUMS.all (covers every released asset, clearly labeled)
        run: |
          cd rel
          ls -la
          sha256sum \
            ./Dehkhoda.RAG_*-full.AppImage \
            ./Dehkhoda.RAG_*-lean.AppImage \
            ./*.deb \
            ./*.pkg.tar.zst \
            ./dehkhoda-setup-win-*-full.exe \
            ./dehkhoda-setup-win-*-lean.exe \
            > SHA256SUMS.all
          cat SHA256SUMS.all
      - name: "v1.3.1 size gates (fail loudly on bundle mistakes)"
        run: |
          python3 - <<'PY'
          import glob, os, sys
          MB = 1_000_000
          lean_mb = os.path.getsize(glob.glob("rel/Dehkhoda.RAG_*-lean.AppImage")[0]) // MB
          full_mb = os.path.getsize(glob.glob("rel/Dehkhoda.RAG_*-full.AppImage")[0]) // MB
          print(f"lean.AppImage = {lean_mb} MB, full.AppImage = {full_mb} MB")
          if lean_mb > 700:
              sys.exit(f"SIZE GATE FAIL: lean grew to {lean_mb} MB — model or index leaked into lean")
          if full_mb < 2000:
              sys.exit(f"SIZE GATE FAIL: full is only {full_mb} MB — model, SQL dumps or snapshot missing")
          if full_mb > 3500:
              sys.exit(f"SIZE GATE FAIL: full is {full_mb} MB — double-bundled (check gzip + that the snapshot is stored compressed)")
          print("size gates OK")
          PY
      - name: Compose Persian release description with real sizes
        run: |
          FULL_APPIMAGE=$(ls rel/Dehkhoda.RAG_*-full.AppImage | head -1)
          LEAN_APPIMAGE=$(ls rel/Dehkhoda.RAG_*-lean.AppImage | head -1)
          FULL_MB=$(( $(stat -c%s "$FULL_APPIMAGE") / 1000000 ))
          LEAN_MB=$(( $(stat -c%s "$LEAN_APPIMAGE") / 1000000 ))
          MODEL_MB=$(python3 -c "import json;print(json.load(open('bootstrap/pins.json'))['embedding_model']['total_size_bytes']//1000000)")
          REVISION=$(python3 -c "import json;print(json.load(open('bootstrap/pins.json'))['embedding_model']['revision'])")
          RECORDS=$(python3 -c "import json;print(f\"{json.load(open('bootstrap/pins.json'))['prebuilt_index']['record_count']:,}\")")
          cat > RELEASE_BODY.md <<EOF
          دو نسخه از همین برنامه منتشر شده است — هر دو از یک کد، با یک پرچم ساخت:

          ## نسخهٔ کامل (کاملاً آفلاین) — شامل مدل، داده‌ها و ایندکس آماده؛ حدود ${FULL_MB} مگابایت
          * فایل‌ها: \`Dehkhoda.RAG_*-full.AppImage\` (لینوکس)، \`dehkhoda-setup-win-*-full.exe\` (ویندوز)
          * مدل زبانی + ۳۳ فایل دادهٔ دهخدا + ایندکس آمادهٔ Qdrant داخل بسته است
          * پس از دانلود، **هیچ اتصال اینترنتی لازم نیست — حتی یک بستهٔ شبکه هم ارسال نمی‌شود**
          * اولین اجرا با بازیابی ایندکس آماده در کمتر از یک دقیقه به «آماده» می‌رسد
          * ایندکس: ${RECORDS} بردار؛ مدل: multilingual-e5-base (revision \`${REVISION}\`)
          * برای تغییر مدل یا تنظیمات برداری در آینده، داده‌های خام SQL هم داخل بسته است (ساخت مجدد کاملاً آفلاین)

          ## نسخهٔ سبک (دانلود در اولین اجرا) — حدود ${LEAN_MB} مگابایت
          * فایل‌ها: \`Dehkhoda.RAG_*-lean.AppImage\` (لینوکس)، \`dehkhoda-setup-win-*-lean.exe\` (ویندوز)
          * در اولین اجرا، مدل زبانی حدود **${MODEL_MB} مگابایت** از huggingface.co دانلود می‌شود
            (با نوار پیشرفت، سرعت، زمان باقی‌مانده، امکان لغو و ادامهٔ دانلود از همان‌جا)
          * بعد از همان دانلود اولیه، برنامه کاملاً آفلاین است؛ اگر اینترنت ندارید، نسخهٔ کامل را برگزینید

          ## بسته‌های توزیع
          * \`*.deb\` — دبیان/اوبونتو (نسخهٔ کامل؛ آفلاین)
          * \`*.pkg.tar.zst\` — آرچ

          ## صحت فایل‌ها
          * \`SHA256SUMS.all\` همهٔ فایل‌ها را پوشش می‌دهد: \`sha256sum -c SHA256SUMS.all\`
          EOF
      - name: Verify SHA256SUMS.all with sha256sum -c (release-page parity check)
        run: |
          cd rel
          sha256sum -c SHA256SUMS.all
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            rel/*.AppImage
            rel/*.deb
            rel/*.pkg.tar.zst
            rel/*.exe
            rel/SHA256SUMS.all
          generate_release_notes: true
      - name: "v1.3.1 published-asset parity check (name + byte count on the release page)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # The v1.3.0 space-vs-dot defect must not recur: open EVERY asset
          # URL GitHub lists for this tag, compare (a) the exact filename and
          # (b) the byte count with the local rel/ files, and verify every
          # SHA256SUMS.all line references a name that actually exists.
          TAG="v${{ env.VERSION }}"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API" > release.json
          python3 - <<'PY'
          import json, os, sys, urllib.request
          rel = json.load(open("release.json"))
          assets = {a["name"]: a["size"] for a in rel["assets"]}
          local = {}
          for f in os.listdir("rel"):
              local[f] = os.path.getsize(os.path.join("rel", f))
          local.pop("release.json", None)
          fails = []
          # 1. every local file that SHOULD be published exists on the page
          for name, size in local.items():
              if name == "SHA256SUMS.txt":   # windows-only intermediate sums
                  continue
              if name not in assets:
                  fails.append(f"missing on release page: {name}")
              elif assets[name] != size:
                  fails.append(f"size mismatch on release page: {name} "
                               f"(local {size} != published {assets[name]})")
          # 2. every SHA256SUMS.all line references a published filename
          for line in open("rel/SHA256SUMS.all"):
              name = line.split(maxsplit=1)[-1].strip()
              if name not in assets:
                  fails.append(f"SHA256SUMS.all references unpublished file: {name}")
          # 3. HEAD-check each asset URL actually serves the bytes
          for a in rel["assets"]:
              req = urllib.request.Request(a["browser_download_url"], method="HEAD")
              with urllib.request.urlopen(req, timeout=60) as r:
                  cl = int(r.headers.get("Content-Length", -1))
              if cl != a["size"]:
                  fails.append(f"HEAD byte count mismatch: {a['name']} ({cl} != {a['size']})")
          if fails:
              sys.exit("PARITY FAIL:\n" + "\n".join(fails))
          print(f"parity OK: {len(assets)} published assets match local bytes")
          PY
