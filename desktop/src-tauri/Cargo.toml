[package]
name = "dehkhoda-rag"
version = "1.3.1"
description = "Dehkhoda Dictionary — hybrid semantic search (Persian RAG)"
authors = ["Dehkhoda RAG contributors"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Keep the binary lean; the heavy lifting happens in the Python sidecar.
[profile.release]
strip = true
lto = true
codegen-units = 1
