<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دهخدا — واژه‌یاب معنایی</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">د</div>
      <div>
        <h1>فرهنگ دهخدا</h1>
        <p class="subtitle">واژه‌یاب معنایی — از معنا به سرواژه</p>
      </div>
    </div>
    <div class="controls">
      <form id="search-mini" class="search-mini" autocomplete="off" hidden role="search">
        <input id="q-mini" type="text" aria-label="معنا یا توصیف"
               placeholder="معنا یا توصیفی که در ذهن دارید را بنویسید…" />
        <button class="btn-primary btn-mini" type="submit">جست‌وجو</button>
      </form>
      <div class="status" role="status">
        <span id="status-dot" class="dot dot-off"></span>
        <span id="status-text">در حال راه‌اندازی موتور…</span>
      </div>
      <button id="repair-btn" class="icon-btn" aria-label="تعمیر راه‌اندازی" title="تعمیر / بازنشانی راه‌اندازی">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" aria-label="تغییر پوسته روشن/تاریک" title="تغییر پوسته">
        <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section id="hero" class="hero">
      <h2 class="hero-title">معنایی که در ذهن دارید را بنویسید؛<br><span class="accent">سرواژه‌اش</span> را می‌یابید.</h2>
      <form id="search-form" class="search-box" autocomplete="off" role="search">
        <input id="q" type="text" aria-label="معنا یا توصیف"
               placeholder="معنا یا توصیفی که در ذهن دارید را بنویسید…" />
        <button id="go" class="btn-primary" type="submit">جست‌وجو</button>
      </form>
      <div class="samples" id="samples" aria-label="نمونه‌جست‌وجوها">
        <button class="chip" type="button" data-q="احساس بی‌قراری و اضطراب">احساس بی‌قراری و اضطراب</button>
        <button class="chip" type="button" data-q="احساس عمیق محبت و دلدادگی">احساس عمیق محبت و دلدادگی</button>
        <button class="chip" type="button" data-q="جرم نورانی آسمان">جرم نورانی آسمان</button>
        <button class="chip" type="button" data-q="وسوسهٔ شیطان و فکرهای ناخواسته">وسوسهٔ شیطان…</button>
      </div>
    </section>

    <section id="results" class="results" aria-live="polite" aria-label="نتایج جست‌وجو"></section>
  </main>

  <footer class="foot">
    <span id="foot-note">۳۱۲٬۵۰۷ مدخل لغت‌نامهٔ دهخدا • جست‌وجوی ترکیبی معنایی + کلیدواژه‌ای (RRF)</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
