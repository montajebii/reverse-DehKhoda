# =============================================================================
# Dehkhoda RAG — Milvus Standalone (pinned)
# ---------------------------------------------------------------------------
# Pinned versions (rationale in docs/VERSIONS.md):
#   * milvusdb/milvus:v2.6.25      latest stable of the locked 2.6.x line (2026-09-29)
#   * quay.io/coreos/etcd:v3.5.18  metadata store, version pair officially shipped
#                                  with Milvus standalone compose
#   * minio RELEASE.2024-05-28T17-19-04Z  object storage, same reason
#
# All volumes are relative or env-driven — no hardcoded host paths:
#   DEHKHODA_VOLUME_DIR (default: ./volumes next to this file)
# Start:  docker compose up -d      Stop:  docker compose down
# =============================================================================
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: dehkhoda-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DEHKHODA_VOLUME_DIR:-./volumes}/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: dehkhoda-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${DEHKHODA_VOLUME_DIR:-./volumes}/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.25
    container_name: dehkhoda-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Desktop-class standalone sizing: keep memory bounded on small machines.
      proxy.grpc.serverMaxRecvSize: "268435456"
      proxy.grpc.serverMaxSendSize: "268435456"
    volumes:
      - ${DEHKHODA_VOLUME_DIR:-./volumes}/milvus:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"   # gRPC — pymilvus
      - "127.0.0.1:9091:9091"     # metrics / healthz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: dehkhoda-rag
